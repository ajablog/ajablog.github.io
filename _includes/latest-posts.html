<!-- Latest Posts -->
<section id="latest" class="wrapper style1">
  <div class="inner">
    <h2 class="major">Latest</h2>
    <div class="latest-list">
      {% for post in site.posts limit:5 %}
      <article class="latest-item">
        <a href="{{ post.url | relative_url }}" class="latest-thumb"><img src="{{ post.image | default: '/images/miscellaneous.jpeg' }}" alt="" /></a>
        <div class="latest-body">
          <p class="latest-meta">{{ post.date | date: "%d %b %Y" }}{% if post.category %} &middot; {{ post.category | replace: '-', ' ' }}{% endif %}</p>
          <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
          {% if post.description %}<p>{{ post.description }}</p>{% endif %}
        </div>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
